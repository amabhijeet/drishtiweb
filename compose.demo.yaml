name: drishti-public-demo
services:
  initialize:
    image: busybox:1.36
    volumes: [demo-data:/volume]
    command: ["sh", "-ec", "if [ ! -f /volume/.public-demo ]; then test -z \"$$(ls -A /volume)\"; touch /volume/.public-demo; chown 10001:10001 /volume /volume/.public-demo; fi"]
  processor:
    image: drishti-server:droplet
    pull_policy: never
    depends_on:
      initialize: {condition: service_completed_successfully}
    environment:
      DRISHTI_DATA_DIR: /app/data
      DRISHTI_PUBLIC_URL: http://processor:10000
      DRISHTI_DEVICE: cpu
      DRISHTI_MAX_VIDEO_MB: "32"
    volumes: [demo-data:/app/data]
    restart: unless-stopped
  web:
    build: {context: ., dockerfile: demo/Dockerfile}
    depends_on:
      processor: {condition: service_healthy}
    ports: ["11002:8080"]
    volumes: [demo-data:/demo-data]
    restart: unless-stopped
volumes:
  demo-data: {}
